<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>TOEFL 2026 Prep — Speaking: Take an Interview</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { max-width: 640px; margin: 24px auto; padding: 0 16px; font: 14px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; color: #101828; }
  h1 { font-size: 18px; }
  h2 { font-size: 15px; }
  label { display: block; margin: 8px 0 2px; color: #475467; font-size: 12px; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d0d5dd; border-radius: 8px; font: inherit; }
  button { margin-top: 8px; padding: 8px 14px; border: 0; border-radius: 8px; background: #1570ef; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.4; }
  #question { font-size: 17px; font-weight: 600; margin: 14px 0 6px; }
  #live { min-height: 60px; background: #f2f4f7; border-radius: 8px; padding: 10px; margin-top: 8px; white-space: pre-wrap; }
  #feedback { margin-top: 12px; }
  .band { font-size: 30px; font-weight: 700; color: #1570ef; }
  .row { font-size: 12px; color: #475467; padding: 4px 0; border-bottom: 1px solid #eaecf0; }
  .settings { background: #f9fafb; border: 1px solid #eaecf0; border-radius: 12px; padding: 12px; margin-bottom: 16px; }
  .hint { font-size: 11px; color: #98a2b3; }
</style>
</head>
<body>
  <h1>TOEFL iBT 2026 · Speaking · Take an Interview</h1>
  <p class="hint">Новый формат (с 21.01.2026): интервьюер задаёт серию вопросов, отвечаешь спонтанно. Оценка по шкале 1–6.</p>

  <div class="settings">
    <label>Провайдер</label>
    <select id="provider">
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="openai">OpenAI</option>
      <option value="deepseek">DeepSeek</option>
    </select>
    <label>API-ключ (хранится локально в браузере)</label>
    <input id="key" type="password" placeholder="sk-..." />
    <button id="saveKey">Сохранить</button>
    <span id="keyMsg" class="hint"></span>
  </div>

  <label>Тема интервью</label>
  <select id="topic"></select>
  <button id="newQ">Новый вопрос</button>

  <div id="question">Нажми «Новый вопрос» и отвечай вслух, как на экзамене (30–45 сек).</div>

  <button id="recBtn">● Записать ответ</button>
  <button id="gradeBtn" disabled>Оценить (1–6)</button>
  <div id="live"></div>
  <div id="feedback"></div>

  <div id="history"></div>

  <script src="app.js"></script>
</body>
</html>
